name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install project
        run: uv sync --locked --group dev

      - name: Run repository gates
        run: |
          # Rich forces ANSI styling when it detects GitHub Actions, which
          # breaks plain-text CLI assertions despite identical CLI behavior.
          unset GITHUB_ACTIONS
          uvx prek@0.4.14 run --all-files --stage pre-commit
          uvx prek@0.4.14 run --all-files --stage pre-push

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate wheel installation
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python "$wheel"
          .release-venv/bin/python -c \
            'import finresearch; print(finresearch.__version__)'
          .release-venv/bin/finresearch --help
          uv pip check --python .release-venv/bin/python
