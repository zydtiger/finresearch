[project]
name = "finresearch"
version = "0.1.0"
description = "Programmatic investment-research workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "filelock>=3.20.0",
    "httpx>=0.28.1",
    "polars>=1.35.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
    "yfinance>=1.0.0",
]

[project.scripts]
finresearch = "finresearch.cli:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
